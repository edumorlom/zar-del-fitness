[project]
name = "zar-del-fitness-assistant"
version = "0.1.0"
description = "Asistente telefónico de Zar del Fitness (Twilio + OpenAI Realtime)"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
    "python-multipart>=0.0.20",
    "websockets>=17.0",
    "twilio>=9.11",
    "python-dotenv>=1.1",
    "tzdata>=2024.1",
]

[dependency-groups]
# Only for test_call.py (talking to the assistant through your microphone)
dev = [
    "sounddevice>=0.5",
    "audioop-lts>=0.2",
]
