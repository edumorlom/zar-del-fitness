name: Despliegue del sitio y del portal

# El sitio (zardelfitness.com.ar) y el portal (mi.zardelfitness.com.ar) son un solo proyecto de Next.js, en site/, con
# un solo build: el servidor de Next.js en site/.next/standalone/, que se sube a Railway. Las páginas del sitio salen
# estáticas en el build; las del portal, en cada pedido. Qué dominio ve qué páginas lo decide site/proxy.ts.
# La base de datos y el bucket del portal son servicios aparte en Railway.
#
# Las credenciales viven en GitHub → Settings → Secrets and variables → Actions, nunca en este archivo.
on:
  push:
    branches: [ main ]
    # Sólo cuando cambia el proyecto, sus datos (db/) o este workflow.
    paths:
      - "site/**"
      - "db/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # RAILWAY_TOKEN puede vivir en este entorno (de cuando el sitio iba a cPanel) o en los secrets del repositorio.
    environment: "CPanel Variables"
    env:
      # Token del proyecto de Railway (Project Settings → Tokens, entorno production).
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      # La clave pública de Clerk (pk_live_…) va en el código del navegador del portal: hace falta al construir, no
      # sólo al correr. Es pública: puede ser una variable (vars) o un secret. Las demás (CLERK_SECRET_KEY,
      # DATABASE_URL, el bucket) viven sólo en las variables del servicio en Railway.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      # El servicio de Railway que sirve los dos dominios, si no se llama "portal".
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE || 'portal' }}
    defaults:
      run:
        working-directory: site
    steps:
      - name: Revisar las credenciales
        run: |
          [ -n "$RAILWAY_TOKEN" ] || { echo "::error::Falta el secret RAILWAY_TOKEN."; exit 1; }
          [ -n "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" ] || { echo "::error::Falta NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: sin ella el portal no deja entrar."; exit 1; }

      - name: Descargar el repositorio
        uses: actions/checkout@v7
        with:
          # Toda la historia: la fecha de cada página en sitemap.xml (lastmod) es la de su último commit
          # (site/lib/git.ts). Con sólo el último commit, todas tendrían la misma.
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar y construir
        # Lint, las pruebas del portal y el build.
        run: npm run check

      - name: Guardar el sitemap publicado
        # Para avisarle después a Bing sólo las páginas que cambiaron (scripts/indexnow.mjs).
        run: curl -sf https://zardelfitness.com.ar/sitemap.xml -o ../sitemap-anterior.xml || true

      - name: Subir a Railway
        # El build de arriba, armado fuera del repo (scripts/deploy-bundle.sh) con deploy/Dockerfile: Railway no
        # construye nada, sólo arma la imagen. --ci espera a que el despliegue termine.
        run: |
          scripts/deploy-bundle.sh "$RUNNER_TEMP/app"
          npx -y @railway/cli@5.71.0 up "$RUNNER_TEMP/app" --path-as-root --no-gitignore --service "$RAILWAY_SERVICE" --ci

      - name: Avisar a Bing (IndexNow)
        run: node scripts/indexnow.mjs ../sitemap-anterior.xml
