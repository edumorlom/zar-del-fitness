name: Despliegue del sitio y del portal

# El sitio y el portal son un solo proyecto de Next.js, en site/, con dos builds
# (ver site/next.config.ts):
# - el sitio: Next.js lo exporta estático en site/out/ (output: "export"), junto
#   con public/ (incluido el .htaccess), y se sube por FTP a cPanel y a Railway
#   (servicio "site"). Node sólo se usa durante el build.
# - el portal (mi.zardelfitness.com.ar): el servidor de Next.js, en
#   site/.next-portal/standalone/, que se sube a Railway (servicio del portal).
# Los dos se construyen acá, antes de subir nada: si uno no compila, no se sube
# ninguno.
#
# Las credenciales viven en GitHub → Settings → Secrets and variables →
# Actions, nunca en este archivo.
on:
  push:
    branches: [ main ]
    # Sólo cuando cambia el proyecto (el sitio y el portal), sus datos (db/) o este workflow.
    paths:
      - "site/**"
      - "db/**"
      - ".github/workflows/ftp-deploy.yml"
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # FTP_SERVER / FTP_USERNAME / FTP_PASSWORD viven en este entorno, no como
    # secrets del repositorio: sin declarar el entorno acá, el job no los ve
    # y la acción de FTP falla con "Input required and not supplied".
    environment: "CPanel Variables"
    env:
      # Token del proyecto de Railway (Project Settings → Tokens, entorno production). Sin él, los pasos de Railway no corren.
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      # La clave pública de Clerk (pk_live_…) va en el código del navegador del portal: hace falta al construirlo, no
      # sólo al correrlo. Es pública: puede ser una variable (vars) o un secret. Las demás (CLERK_SECRET_KEY,
      # DATABASE_URL, el bucket) viven sólo en las variables del servicio del portal en Railway.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      # El nombre del servicio del portal en Railway, si no es "portal".
      RAILWAY_PORTAL_SERVICE: ${{ vars.RAILWAY_PORTAL_SERVICE || 'portal' }}
    defaults:
      run:
        working-directory: site
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7
        with:
          # Toda la historia: la fecha de cada página en sitemap.xml (lastmod) es la de su último commit
          # (site/lib/git.ts). Con sólo el último commit, todas tendrían la misma.
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar y construir el sitio y el portal
        # Lint, las pruebas del portal, el build del sitio (out/) y el del portal (.next-portal/standalone/).
        run: npm run check

      - name: Guardar el sitemap publicado
        # Para avisarle después a Bing sólo las páginas que cambiaron (scripts/indexnow.mjs).
        run: curl -sf https://zardelfitness.com.ar/sitemap.xml -o ../sitemap-anterior.xml || true

      - name: Subir por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # cPanel sirve el dominio principal (zardelfitness.com.ar) desde
          # public_html/, así que ese es el valor por defecto. Si la cuenta
          # FTP ya nace encerrada ahí adentro (se elige un "Directory" al
          # crearla en cPanel → FTP Accounts), creá el secret FTP_SERVER_DIR
          # con "./" para no terminar subiendo a public_html/public_html/.
          # Si es un dominio adicional, poné su carpeta (p. ej.
          # "zardelfitness.com.ar/").
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          local-dir: site/out/

      - name: Subir a Railway
        # El mismo build, servido por Caddy con las reglas del .htaccess (site/deploy/). Se arma fuera del repo: si no,
        # `railway up` saltearía out/ por estar en .gitignore.
        if: env.RAILWAY_TOKEN != ''
        run: |
          dir="$RUNNER_TEMP/sitio"
          mkdir -p "$dir" && cp deploy/Dockerfile deploy/Caddyfile "$dir/" && cp -R out "$dir/out"
          npx -y @railway/cli@5.71.0 up "$dir" --path-as-root --no-gitignore --service site --ci

      - name: Avisar a Bing (IndexNow)
        run: node scripts/indexnow.mjs ../sitemap-anterior.xml

      - name: Subir el portal a Railway
        # Igual que el sitio: el build de arriba, armado fuera del repo (scripts/portal-bundle.sh) con
        # deploy/portal.Dockerfile, y subido con `railway up`. Railway no construye nada: sólo arma la imagen.
        if: env.RAILWAY_TOKEN != ''
        run: |
          if [ -z "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" ]; then
            echo "::error::Falta NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY (Settings → Secrets and variables → Actions): sin ella el portal no deja entrar."
            exit 1
          fi
          scripts/portal-bundle.sh "$RUNNER_TEMP/portal"
          npx -y @railway/cli@5.71.0 up "$RUNNER_TEMP/portal" --path-as-root --no-gitignore --service "$RAILWAY_PORTAL_SERVICE" --ci
